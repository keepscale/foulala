name: App

on:
  push:
    paths: ["app/**", "design/tokens.json", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "design/tokens.json", ".github/workflows/app.yml"]

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Même version qu'en local : le pubspec exige Dart 3.13.5.
          flutter-version: 3.47.7
          cache: true
      - name: Dépendances
        run: flutter pub get
      - name: Analyse statique
        run: flutter analyze
      - name: Tests (dont thème à jour avec design/tokens.json)
        run: flutter test
