name: APK de test

# Construit un APK Android signé, branché sur la base de test Supabase, et le joint à une
# Release GitHub (préversion). Déclenché par un tag :
#   git tag app-v0.1.0 && git push origin app-v0.1.0
# Prérequis (Settings › Secrets and variables › Actions) :
#   - Variables : API_URL, API_KEY (les mêmes que pour la page organisateur)
#   - Secrets : ANDROID_KEYSTORE_BASE64 (le .jks encodé en base64), ANDROID_KEYSTORE_PASSWORD
# Supabase journalise les adresses IP : ces APK servent aux tests entre amis, jamais à une vraie manif.

on:
  push:
    tags: ["app-v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        # Sans clé, Gradle signerait avec une clé de debug jetable : les testeurs ne
        # pourraient plus mettre à jour. On s'arrête plutôt.
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets ANDROID_KEYSTORE_BASE64 et ANDROID_KEYSTORE_PASSWORD manquants"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=foulala
          storeFile=upload-keystore.jks
          EOF

      - name: Construit l'APK
        env:
          API_URL: ${{ vars.API_URL }}
          API_KEY: ${{ vars.API_KEY }}
        # Le numéro de build (versionCode) doit croître à chaque version : numéro du run.
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Variable API_URL manquante (sinon l'app viserait le serveur de dev)"
            exit 1
          fi
          version="${GITHUB_REF_NAME#app-v}"
          flutter build apk --release \
            --build-name "$version" --build-number "${{ github.run_number }}" \
            --dart-define=API_URL="$API_URL" --dart-define=API_KEY="$API_KEY"
          mv build/app/outputs/flutter-apk/app-release.apk "foulala-test-$version.apk"
          sha256sum "foulala-test-$version.apk" > "foulala-test-$version.apk.sha256"

      - name: Publie la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#app-v}"
          gh release create "$GITHUB_REF_NAME" \
            "foulala-test-$version.apk" "foulala-test-$version.apk.sha256" \
            --prerelease --title "Foulala $version (test)" --notes "$(cat <<'EOF'
          **Version de test, branchée sur une base de test (Supabase) : manifs fictives uniquement, jamais une vraie manif.**

          Installer sur Android : télécharger le fichier `.apk` depuis le téléphone, l'ouvrir et autoriser l'installation d'applis inconnues. Pour être prévenu des nouvelles versions : [Obtainium](https://obtainium.imranr.dev/), avec l'adresse de ce dépôt et l'option « Include prereleases ».
          EOF
          )"
