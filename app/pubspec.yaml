name: foulala
description: "Foulala : comptage anonyme et vérifiable des manifestations."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Chaque dépendance est du code tiers qui tourne sur le téléphone :
# vérifier qu'elle n'envoie rien à un tiers avant de l'ajouter (skill revue-vie-privee).
# Jamais d'analytics, de publicité ni de crash reporting.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
  provider: ^6.1.5+1
  http: ^1.6.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Polices embarquées (licence OFL dans assets/fonts) : pas de google_fonts,
  # qui les téléchargerait depuis les serveurs de Google.
  # Bricolage Grotesque et Figtree sont variables : la graisse passe par
  # FontVariation (voir lib/ui/core/themes/theme.dart).
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
