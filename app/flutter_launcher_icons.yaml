# Icône de l'app, variante « Claire » de design/maquettes/Logo.dc.html.
# PNG rendus par design/app-icon/render.sh ; régénérer : dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/launcher/foreground.png"
  min_sdk_android: 21
